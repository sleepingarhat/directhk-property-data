name: "Prop Pool A — Land Registry Monthly Records"
on:
  schedule:
    - cron: "0 3 2 * *" # 每月2號同步土地註冊處月度統計
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Land Registry Scraper
        run: |
          python scrapers/landreg_monthly_scraper.py
      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): automated land registry monthly stats update [skip ci]" && git push)
