name: "Prop Pool B Daily — Midland + Centaline Transactions"
on:
  schedule:
    - cron: "30 22 * * *" # 每日清晨自動抓取各大型行二手一手成交
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Agency Deals Scraper
        run: |
          python scrapers/daily_deals_scraper.py
      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): automated daily transactions update [skip ci]" && git pull --rebase origin main && git push)
